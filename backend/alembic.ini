[alembic]
script_location = alembic

# Use the DATABASE_URL env var for migrations.
# For local dev: alembic upgrade head  (reads DATABASE_URL from env or .env)
sqlalchemy.url = postgresql://scanapp:scanapp_dev@localhost:5432/scanapp

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
