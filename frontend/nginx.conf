# Nginx configuration for React SPA with API reverse proxy

# Docker DNS resolver
resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

# Rate limiting - protect billable AI endpoints
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=extract:10m rate=2r/s;

# Upstream backend (127.0.0.1:8003 when using host network mode,
# backend:8000 when using Docker bridge network)
upstream backend {
    server 127.0.0.1:8003;
    keepalive 32;
}

# DISABLED: Default server - reject unrecognized hostnames to prevent DNS rebinding
# TODO: re-enable for production
#server {
#    listen 80 default_server;
#    server_name _;
#    return 444;
#}

server {
    listen 8081;
    # TODO: restrict server_name for production (was "localhost")
    #server_name localhost;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;

    # Security headers applied to all responses
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com; font-src 'self'" always;

    # Static assets - cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Extract endpoint - stricter rate limit (billable AI API)
    location ~ ^/api/v1/users/[^/]+/receipts/extract$ {
        limit_req zone=extract burst=3 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering on;
        client_max_body_size 500M;
    }

    # Backup/export endpoints — no rate limit, high timeout for large files
    location ~ ^/api/v1/users/[^/]+/backup {
        limit_req zone=api burst=50;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        client_max_body_size 2G;
        proxy_max_temp_file_size 0;
    }

    # API reverse proxy - forward to FastAPI backend
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hide backend server header
        proxy_hide_header Server;

        # Timeouts for large file uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Enable request buffering
        proxy_request_buffering on;
        client_max_body_size 500M;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://backend/health;
        access_log off;
        limit_req zone=api burst=5 nodelay;
    }

    # SPA routing — serve index.html for all non-API routes
    location = /index.html {
        # Prevent redirect loop — serve directly
    }
    location / {
        try_files \$uri \$uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com; font-src 'self'" always;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Increase body size for all locations
    client_max_body_size 500M;
}
