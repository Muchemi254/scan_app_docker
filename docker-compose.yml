services:
  # ========================================================================
  # Redis — batch state store (Celery broker + small caches)
  # ========================================================================
  redis:
    image: redis:7-alpine
    container_name: scan-app-redis
    restart: unless-stopped
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-128mb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru} --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data-network
    # Small VM (1.4 GB RAM): hard caps stop a container from thrashing the
    # host into swap/OOM. Exceeded limits → Docker kills the container
    # (restart policy brings it back) instead of taking down the whole box.
    deploy:
      resources:
        limits:
          memory: 192m

  # ========================================================================
  # Postgres collation auto-fix — one-shot, runs BEFORE postgres.
  # ========================================================================
  # Self-heals installs whose existing cluster was initdb'd by the old
  # postgres:16-alpine image (musl): glibc serves that cluster's en_US.utf8 as a
  # REAL locale, silently invalidating every text btree index (index lookups
  # miss existing rows → the app 401s everything with "User no longer exists").
  # The fix dumps the cluster, re-initdb's it as C.UTF-8, restores, and keeps
  # the old data + dump for rollback. Idempotent — no-op on healthy clusters.
  # Requires Compose v2 (`condition: service_completed_successfully`).
  postgres-collation-fix:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile.fix
    container_name: scan-app-collation-fix
    # CRITICAL: replace the official postgres entrypoint with the fix script —
    # without this the container just boots a plain postgres server and the
    # one-shot never runs (the compose up hangs on the dependency forever).
    entrypoint: ["/usr/local/bin/collation_fix.sh"]
    user: "0:0"  # root — script gosu's to postgres; also chowns the volume
    restart: "no"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Old cluster snapshot (kept for rollback; see collation_fix.sh)
      - pgdata-old:/fix/old
      - collation-fix-backups:/fix-backups
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-scram-sha-256}
      # New cluster must initdb under byte-order collation (see AGENTS.md)
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    networks:
      - data-network

  # ========================================================================
  # PostgreSQL — primary database (rebuilt with Wal-G for WAL archiving)
  # ========================================================================
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: scan-app-postgres-walg:16
    container_name: scan-app-postgres
    ports:
      # Localhost only — never publish the DB to the LAN. Backend/worker reach
      # it over data-network; host tools can use 127.0.0.1:5432.
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    depends_on:
      postgres-collation-fix:
        condition: service_completed_successfully
    # Continuous WAL archiving to the encrypted backup store (§ system backups).
    command:
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backup_data:/backups
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # Byte-order collation, matching the semantics the app was built and
      # tested against (musl treated en_US.utf8 as C). glibc's real
      # en_US.UTF-8 sorts lowercase-first and would silently break text
      # comparisons (e.g. the conversations pair-order check).
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # Wal-G store + encryption (shared with the backup sidecar)
      WALG_FILE_PREFIX: /backups/system_backups/wal
      WALG_LIBSODIUM_KEY_PATH: /backups/system_backups/keys/.backup_key
      WALG_COMPRESSION_METHOD: zstd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data-network
    deploy:
      resources:
        limits:
          memory: 256m

  # ========================================================================
  # FastAPI Backend
  # ========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scan-app-backend
    user: "0:0"  # root — entrypoint fixes volume permissions then drops to appuser
    ports:
      - "8003:8000"
    volumes:
      # Persist SQLite review batch database across container rebuilds
      - review_batch_data:/app/data
      # Local image storage
      - image_data:/app/data/images
      # Backup storage
      - backup_data:/app/backups
    environment:
      # SQLite database path for review batches (transitional — migrating to PG)
      REVIEW_BATCH_DB_PATH: ${REVIEW_BATCH_DB_PATH}
      # PostgreSQL
      DATABASE_URL: postgresql://${POSTGRES_USER}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX}
      USE_POSTGRES: ${USE_POSTGRES}
      # Storage
      IMAGE_STORAGE_DIR: ${IMAGE_STORAGE_DIR}
      BACKUP_STORAGE_DIR: ${BACKUP_STORAGE_DIR}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH}

      # Local auth (offline) — no Firebase required. AUTH_MODE=firebase keeps the old path.
      AUTH_MODE: ${AUTH_MODE}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS}

      # Gemini API
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # Security
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}

      # API
      API_TITLE: ${API_TITLE}
      API_VERSION: ${API_VERSION}
      API_V1_STR: ${API_V1_STR}
      HOST: ${HOST}
      PORT: ${PORT}
      RELOAD: ${RELOAD}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE}
      ENABLE_DOCS: ${ENABLE_DOCS}
      LOG_LEVEL: ${LOG_LEVEL}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}

      # Apply DB migrations at startup (entrypoint.sh). Defaults on so a fresh
      # install works with a single `docker compose up -d --build`.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Restart policy
    restart: unless-stopped

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Networking
    networks:
      - app-network
      - data-network

    deploy:
      resources:
        limits:
          memory: 256m

  # ========================================================================
  # Celery Worker
  # ========================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scan-app-worker
    user: "0:0"  # root — entrypoint fixes volume permissions then drops to appuser
    command: celery -A app.core.celery_app worker --loglevel=${LOG_LEVEL:-INFO} --concurrency=${MAX_AI_CONCURRENCY:-2}
    volumes:
      - image_data:/app/data/images
    environment:
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      USE_POSTGRES: ${USE_POSTGRES}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      IMAGE_STORAGE_DIR: ${IMAGE_STORAGE_DIR}
      MAX_AI_CONCURRENCY: ${MAX_AI_CONCURRENCY}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - redis
      - postgres
      - backend
    networks:
      - app-network
      - data-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      # CMD-SHELL so a shell inside the container expands HOSTNAME (Docker
      # injects it = the container's own auto-assigned hostname, which is the
      # name the celery node registers under). $$ stops Compose interpolating
      # it from the host shell at config time.
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================================================
  # System Backup sidecar — Wal-G (PITR) + nightly encrypted pg_dump + images
  # ========================================================================
  backup:
    build:
      context: ./backup
    image: scan-app-backup:latest
    container_name: scan-app-backup
    restart: unless-stopped
    volumes:
      - backup_data:/backups
      - pgdata:/var/lib/postgresql/data:ro
      - image_data:/system-raw/images:ro
      - review_batch_data:/system-raw/review_batch:ro
    environment:
      # Postgres connection (superuser, for pg_dump/verify)
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # Wal-G store + encryption (same key file as the postgres archive path)
      WALG_FILE_PREFIX: /backups/system_backups/wal
      WALG_LIBSODIUM_KEY_PATH: /backups/system_backups/keys/.backup_key
      WALG_COMPRESSION_METHOD: zstd
      # Retention
      BACKUP_RETAIN_FULL: ${BACKUP_RETAIN_FULL:-7}
      BACKUP_RETAIN_DUMPS: ${BACKUP_RETAIN_DUMPS:-14}
      # Schedules (UTC); one full job covers DB + images in a single process
      CRON_FULL: ${BACKUP_CRON_FULL:-0 2 * * *}
      CRON_VERIFY: ${BACKUP_CRON_VERIFY:-0 4 * * 0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================================
  # React Frontend + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: scan-app-frontend
    ports:
      - "8081:8081"
    depends_on:
      backend:
        condition: service_healthy
    # Bridge network — isolated from the host net namespace. Nginx proxies
    # /api to the backend container over app-network (not 127.0.0.1).
    networks:
      - app-network
    # No runtime env vars needed — Vite bakes them in at build time.
    # VITE_API_URL defaults to /api/v1 (relative, works from any IP).

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Restart policy
    restart: unless-stopped

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 64m

# ============================================================================
# NETWORKS — Tiered isolation
# ============================================================================
networks:
  app-network:
    driver: bridge
  data-network:
    driver: bridge

# ============================================================================
# VOLUMES (if needed for persistent data)
# ============================================================================
volumes:
  pgdata:
    driver: local
  pgdata-old:
    driver: local
  collation-fix-backups:
    driver: local
  image_data:
    driver: local
  review_batch_data:
    driver: local
  backup_data:
    driver: local

# ============================================================================
# NOTES
# ============================================================================
#
# All configuration lives in repo-root .env (template: .env.example).
# Missing SECRET_KEY / DB_PASSWORD / REDIS_PASSWORD / ADMIN_* abort with a
# clear message rather than booting insecure.
#
# Start services:
#   docker compose up -d
#
# View logs:
#   docker compose logs -f backend
#   docker compose logs -f frontend
#
# Stop services:
#   docker compose down
#
# Rebuild images:
#   docker compose build --no-cache
#
# Access:
#   Frontend: http://localhost:8081
#   Backend API: http://localhost:8003
#   API Docs: http://localhost:8003/docs
#