services:
  # ========================================================================
  # Redis — batch state store
  # ========================================================================
  redis:
    image: redis:7-alpine
    container_name: scan-app-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass \${REDIS_PASSWORD:-redis_dev}
    networks:
      - data-network

  # ========================================================================
  # PostgreSQL — primary database
  # ========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: scan-app-postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: scanapp
      POSTGRES_USER: scanapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scanapp_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data-network

  # ========================================================================
  # FastAPI Backend
  # ========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scan-app-backend
    user: "0:0"  # root — entrypoint fixes volume permissions then drops to appuser
    ports:
      - "8003:8000"
    volumes:
      # Mount Firebase service account JSON file
      - ./firebaseservice.json:/app/firebaseservice.json:ro
      # Persist SQLite review batch database across container rebuilds
      - review_batch_data:/app/data
      # Local image storage
      - image_data:/app/data/images
      # Backup storage
      - backup_data:/app/backups
    environment:
      # SQLite database path for review batches (transitional — migrating to PG)
      REVIEW_BATCH_DB_PATH: /app/data/review_batches.db
      # PostgreSQL
      DATABASE_URL: postgresql://scanapp:${DB_PASSWORD:-scanapp_dev}@postgres:5432/scanapp
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 20
      USE_POSTGRES: "true"
      # Image storage
      IMAGE_STORAGE_DIR: /app/data/images
      # Backup storage
      BACKUP_STORAGE_DIR: /app/backups
      # Firebase Configuration - Uses service account JSON file mounted at /app/firebaseservice.json
      FIREBASE_CREDENTIALS_PATH: /app/firebaseservice.json

      # Gemini API
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Security
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      # API
      API_TITLE: "Scan App API"
      API_VERSION: "1.0.0"
      HOST: "0.0.0.0"
      PORT: 8000

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/0

      # Features
      ENABLE_DOCS: "false"

      # Logging
      LOG_LEVEL: INFO

    depends_on:
      - redis
      - postgres

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Restart policy
    restart: unless-stopped

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Networking
    networks:
      - app-network
      - data-network

  # ========================================================================
  # Celery Worker
  # ========================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scan-app-worker
    user: "0:0"  # root — entrypoint fixes volume permissions then drops to appuser
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - ./firebaseservice.json:/app/firebaseservice.json:ro
      - image_data:/app/data/images
    environment:
      FIREBASE_CREDENTIALS_PATH: /app/firebaseservice.json
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/0
      USE_POSTGRES: "true"
      DATABASE_URL: postgresql://scanapp:${DB_PASSWORD:-scanapp_dev}@postgres:5432/scanapp
      IMAGE_STORAGE_DIR: /app/data/images
    depends_on:
      - redis
      - postgres
      - backend
    networks:
      - app-network
      - data-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping", "-d", "celery@$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================================================
   # React Frontend + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
        VITE_API_URL: ${VITE_API_URL}
    container_name: scan-app-frontend
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    # No runtime env vars needed — Vite bakes them in at build time.
    # VITE_API_URL defaults to /api/v1 (relative, works from any IP).

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Restart policy
    restart: unless-stopped

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================================
# NETWORKS — Tiered isolation
# ============================================================================
networks:
  app-network:
    driver: bridge
  data-network:
    driver: bridge

# ============================================================================
# VOLUMES (if needed for persistent data)
# ============================================================================
volumes:
  pgdata:
    driver: local
  image_data:
    driver: local
  review_batch_data:
    driver: local
  backup_data:
    driver: local

# ============================================================================
# NOTES
# ============================================================================
#
# Start services:
#   docker-compose up -d
#
# View logs:
#   docker-compose logs -f backend
#   docker-compose logs -f frontend
#
# Stop services:
#   docker-compose down
#
# Rebuild images:
#   docker-compose build --no-cache
#
# Access:
#   Frontend: http://localhost
#   Backend API: http://localhost:8003
#   API Docs: http://localhost:8003/docs
#
